<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <title>Regolatore spese</title>
  <link rel="manifest" href="manifest.json" />
  <script>
    const v = Date.now();
    document.write(`<link rel="stylesheet" href="style.css?v=${v}">`);
  </script>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    document.write(`<script src="app.js?v=${Date.now()}"><\/script>`);
  </script>
  <script>
    (function () {
      let startY = 0;
      let pulling = false;
      document.addEventListener('touchstart', function (e) {
        if (window.scrollY === 0 && e.touches.length === 1) {
          startY = e.touches[0].clientY;
          pulling = true;
        }
      }, { passive: true });
      document.addEventListener('touchend', function (e) {
        if (!pulling) return;
        const distance = e.changedTouches[0].clientY - startY;
        pulling = false;
        if (window.scrollY === 0 && distance > 80) {
          window.location.reload();
        }
      }, { passive: true });
    })();
  </script>
</body>
</html>
